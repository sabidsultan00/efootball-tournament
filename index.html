<script>
  // Apnar Deploy kora Google Web App Link
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxANBHBedS5xUXYd8pfsQIEjOh8n2gekFCwy6Ssu11L-ylc2gdQx7bcnzfBOjvKh7_mhg/exec";

  // Navigation Logic
  function showSection(id) {
    document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  // Registration Submit
  document.getElementById('regForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const payload = {
      action: "register",
      name: document.getElementById('regName').value,
      gmail: document.getElementById('regGmail').value,
      phone: document.getElementById('regPhone').value,
      konamiId: document.getElementById('regKonami').value,
      device: document.getElementById('regDevice').value,
      photo: document.getElementById('regPhoto').value,
      password: document.getElementById('regPass').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    }).then(() => {
      alert("Registration Successful!");
      document.getElementById('regForm').reset();
    }).catch(err => alert("Data Sent Successfully!"));
  });

  // Score Submit
  document.getElementById('scoreForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const payload = {
      action: "submitScore",
      player: document.getElementById('scorePlayer').value,
      opponent: document.getElementById('scoreOpponent').value,
      score: document.getElementById('myScore').value,
      oppScore: document.getElementById('oppScore').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    }).then(() => alert("Score Submitted for Admin Review!"));
  });

  // Admin Login (Password: ADMIN1625)
  function loginAdmin() {
    const pass = document.getElementById('adminPassInput').value;
    if (pass === "ADMIN1625") {
      document.getElementById('adminAuth').classList.add('hidden');
      document.getElementById('adminControls').classList.remove('hidden');
    } else {
      alert("Invalid Password!");
    }
  }

  // Calculate Form Grade Based on Winning Percentage
  function calculateGrade(winRate) {
    if (winRate >= 75) return { grade: 'A', class: 'grade-A' };
    if (winRate >= 50) return { grade: 'B', class: 'grade-B' };
    if (winRate >= 30) return { grade: 'C', class: 'grade-C' };
    return { grade: 'D', class: 'grade-D' };
  }
</script>
